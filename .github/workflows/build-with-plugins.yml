# 運営者が自分のプラグイン構成で mk-go の image をビルドするための reusable
# workflow (#2940)。
#
# プラグインはビルド時組み込みなので、独自プラグインを使う運営者は必ずビルドを
# 通す必要がある。ところが実測では **運用は 343 MiB で 2GB VPS に載るのに、
# ビルドは 1200MB 制限・並列で OOM する** (`-p 1` なら通る)。さらに BuildKit は
# dockerd に組み込まれているため、本番ホストでビルドすると dockerd のヒープが
# 膨らんだまま返らない (ビルドキャッシュを 60.88GB 消しても 4,465 → 4,485MB で
# 不変。原因はキャッシュではなくビルドの実行そのもの)。
#
# 呼び出し側はこれだけで済む:
#
#   jobs:
#     build:
#       permissions:
#         contents: read
#         packages: write          # publish するなら caller 側で宣言する
#       uses: Elythia-Network/elythia/.github/workflows/build-with-plugins.yml@<タグ または コミット SHA>
#       with:
#         mk_ref: "<同じタグ または コミット SHA>"
#         plugins: |
#           weather https://github.com/foo/elythia-plugin-weather v1.2.0
#       secrets:
#         plugin_token: ${{ secrets.PLUGIN_TOKEN }}   # private plugin を使う場合のみ
#
# **`uses:` は `@main` ではなくタグかコミット SHA で固定させる。** この workflow は
# 呼び出し元の `packages: write` と `plugin_token` を受け取って動くので、ブランチで
# 参照されると `main` に入った変更がそのまま呼び出し側の権限で走る (`mk_ref` を
# 固定しても workflow 自体は `uses:` の ref で解決されるので防げない)。
# docs/plugins/operating.md も同じ書き方にしてある。
#
# **frontend を持つプラグインも扱える。** Dockerfile.bundled が image の中で
# frontend/ をビルドするので、組み込んだプラグインの .vue も SPA に入る (#3379)。
name: Build with plugins

on:
  workflow_call:
    inputs:
      mk_ref:
        description: "mk-go の ref (タグ / ブランチ / commit SHA)。再現性のため必須"
        required: true
        type: string
      plugins:
        description: "組み込むプラグイン。1 行 1 つ `<name> <url> <ref>`"
        required: false
        type: string
        default: ""
      mk_repository:
        description: "mk-go のリポジトリ (fork して使う場合のみ変更する)"
        required: false
        type: string
        default: Elythia-Network/elythia
      image:
        description: "publish 先の image。既定は ghcr.io/<呼び出し元リポジトリ>"
        required: false
        type: string
        default: ""
      tags:
        description: "付ける tag。カンマ区切り"
        required: false
        type: string
        default: latest
      push:
        description: "registry へ push するか。false ならビルドだけ"
        required: false
        type: boolean
        default: true
      include_fxtwitter:
        description: "disabled manifest の FxTwitter preview を明示的に bundle に含める"
        required: false
        type: boolean
        default: false
      production_profile:
        description: "core141/local1 と固定 production plugin inventory を検証する"
        required: false
        type: boolean
        default: false
    secrets:
      plugin_token:
        description: "private なプラグインを clone するための token"
        required: false
    outputs:
      image:
        description: "ビルドした image (tag 付き)"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "push した image の digest"
        value: ${{ jobs.build.outputs.digest }}
      source_revision:
        description: "実際に checkout して build した source commit"
        value: ${{ jobs.build.outputs.source_revision }}
      migration_inventory_sha256:
        description: "production migration inventory の SHA256"
        value: ${{ jobs.build.outputs.migration_inventory_sha256 }}

jobs:
  build:
    runs-on: ubuntu-latest
    # **permissions をここで宣言しない。** reusable workflow の permissions は
    # caller の権限以下にしか設定できず、宣言した時点で caller がそれを持って
    # いなければ run ごと拒否される (`push: false` でも同じ)。push する caller が
    # 自分で `packages: write` を書く。
    outputs:
      image: ${{ steps.target.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
      source_revision: ${{ steps.source.outputs.revision }}
      migration_inventory_sha256: ${{ steps.inventory.outputs.sha256 }}
    steps:
      # frontend/ は本体に入っている (#3379)。
      - name: Checkout mk-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.mk_repository }}
          ref: ${{ inputs.mk_ref }}
          # 後続は mk-go の git 操作を一切しない (プラグインの clone は
          # plugins/<name>/ に作る別リポジトリで、この認証情報を使わない)。
          # 残すと `.git/config` に token が載ったまま、第三者のプラグインの
          # コードが走る。
          persist-credentials: false

      - name: Record checked out source revision
        id: source
        env:
          EXPECTED_REVISION: ${{ inputs.mk_ref }}
          EXPECTED_REPOSITORY: ${{ inputs.mk_repository }}
          PRODUCTION_PROFILE: ${{ inputs.production_profile }}
        run: |
          set -eu
          if [ "$PRODUCTION_PROFILE" = "true" ]; then
            if [ "$EXPECTED_REPOSITORY" != "Misaki-Project/Elythia" ] || [ "${#EXPECTED_REVISION}" -ne 40 ]; then
              echo "production profile requires Misaki-Project/Elythia at a full commit SHA" >&2
              exit 1
            fi
          fi
          revision=$(git rev-parse HEAD)
          case "$revision" in
            *[!0-9a-f]*|'') echo "checked out revision is invalid" >&2; exit 1 ;;
          esac
          if [ "${#revision}" -ne 40 ]; then
            echo "checked out revision is not a full commit SHA" >&2
            exit 1
          fi
          if [ "${#EXPECTED_REVISION}" -eq 40 ]; then
            case "$EXPECTED_REVISION" in
              *[!0-9a-f]*) echo "requested source SHA is invalid" >&2; exit 1 ;;
            esac
            if [ "$EXPECTED_REVISION" != "$revision" ]; then
              echo "checked out revision differs from requested SHA" >&2
              exit 1
            fi
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # token は URL 書き換えで差し込む。プラグインの指定に token を書かせると
      # workflow のログや outputs に載る経路が増える。
      # **`if:` から secrets は参照できない** (step の if で使えるのは env / github /
      # inputs / job / matrix / needs / runner / steps / strategy / vars のみ)。
      # 書くと式の検証で `Unrecognized named-value` になり、**呼び出し元の job が
      # 1 つも走らずに失敗する** — token を渡さない呼び出しでも同じ。判定は run の
      # 中で行う。step の env は if からは見えないが run からは見える。
      #
      # 指定を検証して plugins/<name>/ に materialise する。ref は必須で、
      # git の引数として解釈されうる値 (先頭 `-` など) は弾く。
      #
      # **token の設定と clone を同じ step に置き、抜けるときに必ず消す。**
      # `--global` に書いたまま step を終えると、後続の `go run ./tools/pluginbuild`
      # (プラグインの go.mod を解決する) からも `~/.gitconfig` 経由で token が読める。clone が要るのはこの step だけ。
      # trap は EXIT に掛けるので、pluginresolve が失敗して `set -e` で抜ける
      # ときも消える。消し損ねたら step ごと落とす (token が残ったまま後続へ
      # 進ませない)。
      - name: Resolve plugins
        if: inputs.plugins != ''
        env:
          PLUGIN_TOKEN: ${{ secrets.plugin_token }}
          MK_PLUGINS: ${{ inputs.plugins }}
        run: |
          set -eu
          if [ "${{ inputs.production_profile }}" = "true" ]; then
            normalized=$(printf '%s\n' "$MK_PLUGINS" | awk 'NF { if (NF != 3) exit 1; print $1 " " $2 " " $3 }')
            expected=$(printf '%s\n' \
              'genshin https://github.com/Misaki-Project/mk-plugin-genshin.git 9a50079ec9d198ab44e4b9ff24d0a408109c09da' \
              'fedwatch https://github.com/Elythia-Network/elythia-plugin-fedwatch.git af105a020656aaba121998a0bd5a51bee232dec8' \
              'hsr https://github.com/Misaki-Project/elythia-plugin-hsr.git 820068d720654650d5dc05d4136ad9f32f677fef')
            if [ "$normalized" != "$expected" ]; then
              echo "production plugin requests differ from their reviewed pins" >&2
              exit 1
            fi
            bash .github/scripts/resolve-production-plugins.sh .
          elif [ -n "${PLUGIN_TOKEN:-}" ]; then
            key="url.https://x-access-token:${PLUGIN_TOKEN}@github.com/.insteadOf"
            trap 'rc=$?; git config --global --unset-all "$key" || rc=1; exit "$rc"' EXIT
            git config --global "$key" "https://github.com/"
          else
            echo "plugin_token が渡されていないので URL 書き換えは設定しません"
          fi
          if [ "${{ inputs.production_profile }}" != "true" ]; then
            printf '%s\n' "$MK_PLUGINS" | go run ./tools/pluginresolve
          fi

      # プラグインの配線を生成し、要求したプラグインが実際に組み込まれるかを
      # 突き合わせる。生成は Dockerfile 側でも走る (冪等)。
      - name: Generate plugin wiring
        id: wiring
        env:
          MK_PLUGINS: ${{ inputs.plugins }}
        run: |
          set -eu
          if [ "${{ inputs.include_fxtwitter }}" = "true" ]; then
            out=$(GOWORK=off go run ./tools/pluginbuild -include-disabled-dir plugins/fxtwitter-preview)
          else
            out=$(GOWORK=off go run ./tools/pluginbuild)
          fi
          printf '%s\n' "$out"
          printf '%s\n' "$out" > "$RUNNER_TEMP/pluginbuild-output.txt"

          if [ "${{ inputs.production_profile }}" = "true" ]; then
            for dir in plugins/rolelevel plugins/genshin plugins/fedwatch plugins/hsr plugins/fxtwitter-preview plugins/tracking-parameter-cleaner; do
              case "$out" in
                *"dir=$dir "*) ;;
                *) echo "::error::required production plugin directory was not registered: $dir"; exit 1 ;;
              esac
            done
          fi

          # **要求したプラグインが実際に組み込まれたかを突き合わせる。**
          # pluginbuild は elythia-plugin.yml が `disabled: true` のプラグインを
          # 黙って skip して exit 0 で終わる。しかも `disabled: true` は
          # このプロジェクト自身が同梱プラグインに要求している書き方 (#2701) なので、
          # 作者がそれに倣っていれば必ず踏む。見ないと **指定した N 個のうち
          # 0 個しか入っていない image が緑で push される** — #2940 が塞ごうと
          # している穴そのものになる。
          #
          # 判定は pluginbuild の出力形式に依存する。形式が変われば全て
          # 「組み込まれていない」と判定されて落ちるので、空振りはしない。
          #
          # **突き合わせるのはディレクトリ名。** pluginbuild が最初に出す名前は
          # `elythia-plugin.yml` の `name:` で、置いたディレクトリ名とは限らない。
          # 運営者が指定できるのはディレクトリ名だけなので、そちらで照合しないと
          # **正しく組み込まれたプラグインで落ちる** (しかも診断が disabled を
          # 疑わせる方向になり、事実と逆を指す)。`dir=` は name より前に出るので、
          # elythia-plugin.yml の `name:` に細工しても別プラグインの行は偽装できない。
          #
          # `GOWORK=off` が要る。ここは pluginbuild が go.work を書いた後に走る
          # 唯一の `go run ./tools/*` で、付けないとプラグイン側の go.mod の問題が
          # 「突き合わせ step が落ちた」として現れて原因から遠くなる。
          if [ -n "${MK_PLUGINS}" ]; then
            printf '%s\n' "$MK_PLUGINS" \
              | GOWORK=off go run ./tools/pluginresolve -dry-run > "$RUNNER_TEMP/requested.txt"
            while read -r name _rest; do
              if [ -z "$name" ]; then continue; fi
              case "$out" in
                *"dir=plugins/${name} "*) ;;
                *)
                  echo "::error::プラグイン ${name} が組み込まれませんでした。elythia-plugin.yml が disabled: true になっていないか確認してください"
                  exit 1
                  ;;
              esac
            done < "$RUNNER_TEMP/requested.txt"
          fi

      - name: Verify production migration inventory
        id: inventory
        if: inputs.production_profile
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -eu
          go run -tags productioninventory ./tools/migrationinventory -revision "$SOURCE_REVISION" > "$RUNNER_TEMP/migration-inventory.json"
          GOWORK=off go run ./tools/checkproductioninventory \
            -inventory "$RUNNER_TEMP/migration-inventory.json" \
            -baseline .github/release/production-migration-baseline.json \
            -approved-additions .github/release/approved-production-migration-additions.json \
            -pluginbuild-output "$RUNNER_TEMP/pluginbuild-output.txt" \
            -revision "$SOURCE_REVISION"
          inventory_sha=$(sha256sum "$RUNNER_TEMP/migration-inventory.json" | awk '{print $1}')
          echo "sha256=$inventory_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # image 名は小文字でなければ registry が受け付けない。GitHub の owner 名は
      # 大文字を含みうるので、既定を組み立てるときに落とす。
      - name: Resolve image target
        id: target
        env:
          IMAGE: ${{ inputs.image }}
          FALLBACK: ghcr.io/${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -eu
          base="${IMAGE:-$FALLBACK}"
          base=$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]')
          # login は ghcr.io にしか行わない。別のレジストリを受けると、ビルドは
          # 通って push で 401 になる (原因から遠い失敗の仕方をする)。
          case "$base" in
            ghcr.io/*) ;;
            *) echo "image は ghcr.io/... である必要があります: $base" >&2; exit 1 ;;
          esac
          out=""
          # glob を無効にする。tag に `*` が入るとカレントディレクトリの
          # ファイル名に展開される。
          set -f
          IFS=','
          for tag in $TAGS; do
            tag=$(printf '%s' "$tag" | tr -d ' ')
            if [ -z "$tag" ]; then continue; fi
            out="${out:+$out,}${base}:${tag}"
          done
          if [ -z "$out" ]; then
            echo "tags が空です" >&2
            exit 1
          fi
          echo "tags=$out" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.bundled
          platforms: linux/amd64
          build-args: |
            PLUGIN_INCLUDE_DISABLED_DIR=${{ inputs.include_fxtwitter && 'plugins/fxtwitter-preview' || '' }}
          push: ${{ inputs.push }}
          tags: ${{ steps.target.outputs.tags }}
          labels: |
            org.opencontainers.image.title=mk-go
            org.opencontainers.image.description=mk-go built with operator-selected plugins
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            io.elythia.production.profile=${{ inputs.production_profile && 'core141-fx6-v1' || 'generic' }}
          cache-from: type=gha
          # **mode=min にする。** max は中間 stage をすべて書き出すので、
          # `COPY . .` 済みの builder stage (build context が `du -sm` で 421 MB、プラグインのソース込み) が
          # **呼び出し元の** 10GB キャッシュ枠を埋める。
          #
          # **`--mount=type=cache` の中身は cache-to では運ばれない** (min でも max
          # でも空。実測)。runner は毎回まっさらなので Go のビルドはどちらでも
          # 走り直す。max にすると `apk add` と `go mod download` に加えて frontend
          # stage (`pnpm fetch` の層。#3379 の P4c で約 1.2GB と実測した値は pnpm の store を
          # 層に含んでいた頃のもので、cache mount へ移した今はそれより小さい) も救えるが、その分が呼び出し元の枠を
          # 圧迫する。min のままにする代わりに、frontend は毎回ビルドし直す
          # (手元の冷えたビルドで frontend stage だけ約 3 分、#3379)。
          cache-to: type=gha,mode=min
