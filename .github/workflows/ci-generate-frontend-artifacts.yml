name: PR generated frontend artifacts

on:
  pull_request:
    branches:
      - ci/elythia-2.2-upstream-base-20261115

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate locale interface
        run: pnpm --filter i18n generate

      - name: Build misskey-js
        run: pnpm --filter misskey-js build

      - name: Generate misskey-js API report
        run: pnpm --filter misskey-js api

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-frontend-files-${{ github.sha }}
          path: |
            frontend/packages/i18n/src/autogen/locale.ts
            frontend/packages/misskey-js/etc/misskey-js.api.md
          if-no-files-found: error
          retention-days: 7
