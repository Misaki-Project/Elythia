name: Misaki image with Genshin, Fedwatch and HSR

# 手動実行のみ。公開後も本番のcomposeや稼働containerは変更しない。
on:
  workflow_dispatch:

# 既存Docker workflowと同じ範囲。既存GITHUB_TOKENのみ使用する。
permissions:
  contents: read
  packages: write

jobs:
  build:
    # ローカル参照は呼び出し元の不変commitから解決される。
    uses: ./.github/workflows/build-with-plugins.yml
    with:
      mk_repository: ${{ github.repository }}
      mk_ref: ${{ github.sha }}
      plugins: |
        genshin https://github.com/Misaki-Project/mk-plugin-genshin.git 253a472ab09e87a471c3746dca4a6a0279022a0a
        fedwatch https://github.com/Elythia-Network/elythia-plugin-fedwatch.git af105a020656aaba121998a0bd5a51bee232dec8
        hsr https://github.com/Elythia-Network/elythia-plugin-hsr.git 07c5c1bb43cc34de5e79823238567a17623323be
      image: ghcr.io/misaki-project/mk-genshin
      # 再実行でも既存tagを上書きしない。
      tags: elythia-2-0-20261007-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      push: true
