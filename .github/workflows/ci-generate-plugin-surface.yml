name: PR generated plugin surface

on:
  pull_request:
    branches: [ci/elythia-2.2-upstream-base-20261115]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./tools/pluginspec -write
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-plugin-surface-${{ github.sha }}
          path: internal/entitycompat/testdata/golden_plugin_surface.txt
          if-no-files-found: error
          retention-days: 7
