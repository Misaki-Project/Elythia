name: Misaki plugin compatibility

on:
  pull_request:
    branches: [Misaki-develop]
  push:
    branches: [Misaki-develop]

permissions:
  contents: read

jobs:
  plugin-regressions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mk
          POSTGRES_PASSWORD: mk
          POSTGRES_DB: misskey_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mk -d misskey_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '5432'
      TEST_DB_NAME: misskey_test
      TEST_DB_USER: mk
      TEST_DB_PASS: mk
      MK_PLUGIN_TESTS_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve pinned production plugins
        run: |
          set -euo pipefail
          printf '%s\n' \
            'genshin https://github.com/Misaki-Project/mk-plugin-genshin.git 9a50079ec9d198ab44e4b9ff24d0a408109c09da' \
            'fedwatch https://github.com/Elythia-Network/elythia-plugin-fedwatch.git af105a020656aaba121998a0bd5a51bee232dec8' \
            'hsr https://github.com/Misaki-Project/elythia-plugin-hsr.git 820068d720654650d5dc05d4136ad9f32f677fef' \
            | GOWORK=off go run ./tools/pluginresolve
      - name: Vet, race tests and build every production plugin
        run: |
          set -euo pipefail
          for dir in plugins/rolelevel plugins/genshin plugins/fedwatch plugins/hsr; do
            (
              cd "$dir"
              # 外部プラグインの依存台帳は本体SDKのreplaceに合わせて準備する。
              # runner上の変更をログへ残し、ソースや固定refには手を入れない。
              if [ "$dir" = plugins/fedwatch ] || [ "$dir" = plugins/hsr ]; then
                GOWORK=off go mod tidy
                git diff -- go.mod go.sum
              fi
              GOWORK=off go mod download all
              export GOWORK=off GOFLAGS=-mod=readonly
              go vet ./...
              go test ./... -v -race -count=1 -shuffle=3
              go build ./...
            )
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - name: Generate plugin frontend wiring
        run: GOWORK=off go run ./tools/pluginbuild
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Check plugin frontend regressions
        working-directory: frontend
        run: |
          set -euo pipefail
          # vitest設定も生成済みi18nを参照するため、workspace全体を先にビルドする。
          pnpm build
          pnpm --filter frontend exec vitest run --config vitest.config.plugins.ts
          pnpm --filter frontend exec vitest run test/unit/game-ranking-pages.test.ts test/unit/game-ranking-ui.test.ts test/unit/hsr-policy.test.ts
      - name: Check integrated production frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm --no-bail --filter frontend --filter sw --filter misskey-js run typecheck
          pnpm --filter frontend run eslint
          pnpm --filter misskey-js api-prod
