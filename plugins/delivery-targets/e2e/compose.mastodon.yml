# tests/federation/compose.mastodon.yml に重ねる (#52)。compose.misskey.yml と同じ形。
name: mk-delivery-targets-mastodon

services:
  test-runner:
    environment:
      FEDERATION_COMMON_DIR: /tests/common
    volumes:
      - ../../plugins/delivery-targets/e2e:/dt:ro
    working_dir: /dt/mastodon
    # tests/federation の image は pytest -x で最初の失敗で止まる。ここでは
    # 指定ごとに独立した判定なので、壊れた指定を一度に全部出すため -x を外す
    command: ["pytest", "-vs", "--tb=short"]
