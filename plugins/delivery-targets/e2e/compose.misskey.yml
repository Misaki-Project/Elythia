# tests/federation/compose.misskey.yml に重ねる (#52)。
#
#   docker compose -f tests/federation/compose.misskey.yml \
#     -f plugins/delivery-targets/e2e/compose.misskey.yml ...
#
# 相対パスは最初の -f のディレクトリ (tests/federation) から解かれる。
# project name を分け、tests/federation の連合テストと同時に回してもぶつからないようにする。
name: mk-delivery-targets-misskey

services:
  test-runner:
    environment:
      FEDERATION_COMMON_DIR: /tests/common
    volumes:
      - ../../plugins/delivery-targets/e2e:/dt:ro
    working_dir: /dt/misskey
    # tests/federation の image は pytest -x で最初の失敗で止まる。ここでは
    # 指定ごとに独立した判定なので、壊れた指定を一度に全部出すため -x を外す
    command: ["pytest", "-vs", "--tb=short"]
